<title>McEwan&#x27;s Demolition | Website preview</title>
<style>
  :root{--bg:#EEF0EC;--ink:#1C2320;--muted:#5B645F;--accent:#40704A}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header{max-width:1280px;margin:0 auto;padding:28px 20px 8px}
  h1{font-size:clamp(22px,3vw,30px);margin:0 0 6px;letter-spacing:-.01em}
  p{margin:0;color:var(--muted);font-size:16px;line-height:1.5}
  a.live{display:inline-flex;align-items:center;gap:.3em;margin-top:14px;min-height:44px;padding:0 18px;border-radius:999px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600}
  .stage{max-width:1280px;margin:0 auto;padding:20px;display:flex;gap:32px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
  figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px}
  figcaption{font-size:14px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .desk{background:#fff;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.12);overflow:hidden}
  .bar{height:34px;background:#E4E6E2;display:flex;align-items:center;gap:6px;padding:0 12px}
  .bar i{width:10px;height:10px;border-radius:50%;background:#C9CCC7;display:block}
  .phone{background:#111;border-radius:44px;padding:12px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
  .phone .screen{border-radius:32px;overflow:hidden;background:#fff}
  .clip{overflow:hidden;position:relative}
  iframe{border:0;display:block;transform-origin:0 0;background:#fff}
</style>
</head>
<body>
<header>
  <h1>McEwan&#x27;s Demolition</h1>
  <p>Your new homepage, shown on a computer and on a phone. Both scroll on their own.</p>
  <a class="live" href="/mcewans-demolition/">Open the full site</a>
</header>
<div class="stage">
  <figure id="f-desk"><figcaption>On a computer</figcaption>
    <div class="desk"><div class="bar"><i></i><i></i><i></i></div>
      <div class="clip" id="c-desk"><iframe id="i-desk" src="/mcewans-demolition/" width="1440" height="900" title="Homepage on a computer"></iframe></div>
    </div>
  </figure>
  <figure id="f-phone"><figcaption>On a phone</figcaption>
    <div class="phone"><div class="screen">
      <div class="clip" id="c-phone"><iframe id="i-phone" src="/mcewans-demolition/" width="390" height="844" title="Homepage on a phone"></iframe></div>
    </div></div>
  </figure>
</div>
<script>
function fit(){
  var vw=Math.min(document.documentElement.clientWidth,1280)-40;
  var narrow=vw<900;
  var dW=narrow?vw:Math.max(480,vw-390-32-24);
  var ds=Math.min(1,dW/1440);
  var ps=Math.min(1,(narrow?vw-24:390)/390);
  [['desk',1440,900,ds],['phone',390,844,ps]].forEach(function(a){
    var f=document.getElementById('i-'+a[0]),c=document.getElementById('c-'+a[0]);
    f.style.transform='scale('+a[3]+')';c.style.width=(a[1]*a[3])+'px';c.style.height=(a[2]*a[3])+'px';
  });
}
window.addEventListener('resize',fit);fit();
</script>
</body>
